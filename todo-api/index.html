<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App - Gerenciador de Tarefas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .content {
            padding: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .add-todo-form {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #51cf66 0%, #40c057 100%);
        }

        .todos-section h2 {
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .todo-item {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
            position: relative;
        }

        .todo-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }

        .todo-item.completed {
            background: #f8f9fa;
            border-color: #51cf66;
        }

        .todo-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 10px;
        }

        .todo-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin: 0;
        }

        .todo-item.completed .todo-title {
            text-decoration: line-through;
            color: #999;
        }

        .todo-description {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .todo-item.completed .todo-description {
            color: #999;
        }

        .todo-meta {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 15px;
        }

        .todo-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-badge.pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-badge.completed {
            background: #d1edff;
            color: #0c5460;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state img {
            width: 120px;
            opacity: 0.5;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
            
            .todo-actions {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Todo App</h1>
            <p>Gerencie suas tarefas de forma simples e eficiente</p>
        </div>

        <div class="content">
            <!-- Estatísticas -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="total-todos">0</div>
                    <div class="stat-label">Total de Tarefas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="completed-todos">0</div>
                    <div class="stat-label">Concluídas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="pending-todos">0</div>
                    <div class="stat-label">Pendentes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="completion-rate">0%</div>
                    <div class="stat-label">Taxa de Conclusão</div>
                </div>
            </div>

            <!-- Mensagens -->
            <div id="message-container"></div>

            <!-- Formulário para adicionar nova tarefa -->
            <div class="add-todo-form">
                <h2>➕ Adicionar Nova Tarefa</h2>
                <form id="todo-form">
                    <div class="form-group">
                        <label for="todo-title">Título *</label>
                        <input type="text" id="todo-title" required placeholder="Digite o título da tarefa...">
                    </div>
                    <div class="form-group">
                        <label for="todo-description">Descrição</label>
                        <textarea id="todo-description" placeholder="Digite uma descrição opcional..."></textarea>
                    </div>
                    <button type="submit" class="btn">Adicionar Tarefa</button>
                </form>
            </div>

            <!-- Lista de tarefas -->
            <div class="todos-section">
                <h2>📋 Suas Tarefas</h2>
                <div id="todos-container">
                    <div class="loading">Carregando tarefas...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';

        // Elementos do DOM
        const todoForm = document.getElementById('todo-form');
        const todoTitle = document.getElementById('todo-title');
        const todoDescription = document.getElementById('todo-description');
        const todosContainer = document.getElementById('todos-container');
        const messageContainer = document.getElementById('message-container');

        // Elementos de estatísticas
        const totalTodosEl = document.getElementById('total-todos');
        const completedTodosEl = document.getElementById('completed-todos');
        const pendingTodosEl = document.getElementById('pending-todos');
        const completionRateEl = document.getElementById('completion-rate');

        // Função para mostrar mensagens
        function showMessage(message, type = 'success') {
            const messageEl = document.createElement('div');
            messageEl.className = type;
            messageEl.textContent = message;
            messageContainer.innerHTML = '';
            messageContainer.appendChild(messageEl);
            
            setTimeout(() => {
                messageEl.remove();
            }, 5000);
        }

        // Função para fazer requisições HTTP
        async function apiRequest(endpoint, options = {}) {
            try {
                const response = await fetch(`${API_BASE_URL}${endpoint}`, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    ...options
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Erro na requisição');
                }

                return await response.json();
            } catch (error) {
                console.error('Erro na API:', error);
                throw error;
            }
        }

        // Função para carregar estatísticas
        async function loadStats() {
            try {
                const stats = await apiRequest('/todos/stats');
                totalTodosEl.textContent = stats.total;
                completedTodosEl.textContent = stats.completed;
                pendingTodosEl.textContent = stats.pending;
                completionRateEl.textContent = `${stats.completion_rate}%`;
            } catch (error) {
                console.error('Erro ao carregar estatísticas:', error);
            }
        }

        // Função para carregar tarefas
        async function loadTodos() {
            try {
                const todos = await apiRequest('/todos');
                renderTodos(todos);
                await loadStats();
            } catch (error) {
                showMessage('Erro ao carregar tarefas: ' + error.message, 'error');
                todosContainer.innerHTML = '<div class="error">Erro ao carregar tarefas. Verifique se a API está rodando.</div>';
            }
        }

        // Função para renderizar tarefas
        function renderTodos(todos) {
            if (todos.length === 0) {
                todosContainer.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 4rem; margin-bottom: 20px;">📝</div>
                        <h3>Nenhuma tarefa encontrada</h3>
                        <p>Adicione sua primeira tarefa usando o formulário acima!</p>
                    </div>
                `;
                return;
            }

            todosContainer.innerHTML = todos.map(todo => `
                <div class="todo-item ${todo.completed ? 'completed' : ''}" data-id="${todo.id}">
                    <div class="status-badge ${todo.completed ? 'completed' : 'pending'}">
                        ${todo.completed ? '✅ Concluída' : '⏳ Pendente'}
                    </div>
                    
                    <div class="todo-header">
                        <h3 class="todo-title">${escapeHtml(todo.title)}</h3>
                    </div>
                    
                    ${todo.description ? `<div class="todo-description">${escapeHtml(todo.description)}</div>` : ''}
                    
                    <div class="todo-meta">
                        <strong>Criada:</strong> ${formatDate(todo.created_at)} | 
                        <strong>Atualizada:</strong> ${formatDate(todo.updated_at)}
                    </div>
                    
                    <div class="todo-actions">
                        <button class="btn btn-sm ${todo.completed ? 'btn-warning' : 'btn-success'}" 
                                onclick="toggleTodo(${todo.id})">
                            ${todo.completed ? '↩️ Reabrir' : '✅ Concluir'}
                        </button>
                        <button class="btn btn-sm" onclick="editTodo(${todo.id})">
                            ✏️ Editar
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="deleteTodo(${todo.id})">
                            🗑️ Deletar
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Função para escapar HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Função para formatar data
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('pt-BR');
        }

        // Função para adicionar nova tarefa
        async function addTodo(title, description) {
            try {
                await apiRequest('/todos', {
                    method: 'POST',
                    body: JSON.stringify({
                        title: title,
                        description: description || null
                    })
                });
                
                showMessage('Tarefa adicionada com sucesso!');
                todoForm.reset();
                await loadTodos();
            } catch (error) {
                showMessage('Erro ao adicionar tarefa: ' + error.message, 'error');
            }
        }

        // Função para alternar status da tarefa
        async function toggleTodo(id) {
            try {
                await apiRequest(`/todos/${id}/toggle`, {
                    method: 'PATCH'
                });
                
                showMessage('Status da tarefa atualizado!');
                await loadTodos();
            } catch (error) {
                showMessage('Erro ao atualizar tarefa: ' + error.message, 'error');
            }
        }

        // Função para deletar tarefa
        async function deleteTodo(id) {
            if (!confirm('Tem certeza que deseja deletar esta tarefa?')) {
                return;
            }

            try {
                await apiRequest(`/todos/${id}`, {
                    method: 'DELETE'
                });
                
                showMessage('Tarefa deletada com sucesso!');
                await loadTodos();
            } catch (error) {
                showMessage('Erro ao deletar tarefa: ' + error.message, 'error');
            }
        }

        // Função para editar tarefa
        async function editTodo(id) {
            const newTitle = prompt('Digite o novo título:');
            if (!newTitle) return;

            const newDescription = prompt('Digite a nova descrição (opcional):');

            try {
                await apiRequest(`/todos/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        title: newTitle,
                        description: newDescription || null
                    })
                });
                
                showMessage('Tarefa atualizada com sucesso!');
                await loadTodos();
            } catch (error) {
                showMessage('Erro ao atualizar tarefa: ' + error.message, 'error');
            }
        }

        // Event listeners
        todoForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = todoTitle.value.trim();
            const description = todoDescription.value.trim();
            
            if (!title) {
                showMessage('Por favor, digite um título para a tarefa.', 'error');
                return;
            }
            
            await addTodo(title, description);
        });

        // Verificar se a API está rodando
        async function checkApiStatus() {
            try {
                await apiRequest('/');
                return true;
            } catch (error) {
                showMessage('❌ API não está rodando. Execute: python app.py', 'error');
                todosContainer.innerHTML = `
                    <div class="error">
                        <h3>⚠️ API não encontrada</h3>
                        <p>Certifique-se de que o servidor FastAPI está rodando em http://localhost:8000</p>
                        <p>Execute o comando: <code>python app.py</code></p>
                    </div>
                `;
                return false;
            }
        }

        // Inicializar aplicação
        async function init() {
            const apiRunning = await checkApiStatus();
            if (apiRunning) {
                await loadTodos();
            }
        }

        // Carregar tarefas quando a página carregar
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
